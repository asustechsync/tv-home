<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Home</title>
<style>html,body{margin:0;height:100%;background:#000}</style>
</head>
<body>
<script>
  // Carga el diseño más reciente directo desde GitHub (sin esperar la caché de jsDelivr).
  // Si no hay conexión con GitHub, usa la copia home.html que viene con el módulo.
  var SOURCES = [
    "https://raw.githubusercontent.com/asustechsync/tv-home/main/home.html?t=" + Date.now(),
    "home.html"
  ];

  function render(html) {
    document.open();
    document.write(html);
    document.close();
  }

  function tryLoad(i) {
    if (i >= SOURCES.length) return;
    var xhr = new XMLHttpRequest();
    xhr.open("GET", SOURCES[i], true);
    xhr.timeout = 6000;
    xhr.onload = function () {
      if (xhr.status >= 200 && xhr.status < 300 && xhr.responseText.indexOf("<html") >= 0) render(xhr.responseText);
      else tryLoad(i + 1);
    };
    xhr.onerror = xhr.ontimeout = function () { tryLoad(i + 1); };
    xhr.send();
  }
  tryLoad(0);
</script>
</body>
</html>
