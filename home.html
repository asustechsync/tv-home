<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Home</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; position: fixed; left: 0; top: 0; }
  body { color: #fff; font-family: "Samsung One", "SF Pro Display", "Helvetica Neue", Arial, sans-serif; }

  #bg, #bg2 {
    position: fixed; left: 0; top: 0; width: 100%; height: 100%;
    background-size: cover; background-position: center;
    -webkit-transition: opacity .8s ease; transition: opacity .8s ease;
  }
  #bg2 { opacity: 0; }
  .shade {
    position: absolute; left: 0; right: 0; bottom: 0; height: 38%;
    background: linear-gradient(to bottom, rgba(0,0,0,0) 0%, rgba(0,0,0,.28) 70%, rgba(0,0,0,.42) 100%);
  }
  .shade-top {
    position: absolute; left: 0; right: 0; top: 0; height: 30%;
    background: linear-gradient(to top, rgba(0,0,0,0) 0%, rgba(0,0,0,.28) 100%);
  }

  .title {
    position: absolute; left: 4vw; top: 3.5vw;
    font-size: 4.2vw; font-weight: 900; line-height: .95; letter-spacing: -.1vw;
    text-transform: uppercase; text-shadow: 0 .3vw 1.2vw rgba(0,0,0,.6);
  }
  .title small { display: block; font-size: 1.6vw; font-weight: 400; letter-spacing: 0; text-transform: none; margin-top: .8vw; opacity: .9; }

  .pill {
    position: absolute; right: 3vw; top: 3vw;
    background: rgba(40,40,40,.55); border-radius: 3vw;
    padding: .55vw 1.3vw; font-size: 1.3vw; font-weight: 600;
  }

  /* Resplandor del color de la app seleccionada (como Apple TV) */
  #glow {
    position: fixed; left: 0; right: 0; bottom: -12%; height: 42%;
    background: radial-gradient(ellipse at center, rgba(0,0,0,0) 0%, rgba(0,0,0,0) 70%);
    opacity: .22; -webkit-transition: background .4s ease; transition: background .4s ease;
  }

  /* Bandeja translúcida que contiene las apps */
  .dock {
    position: absolute; left: 50%; bottom: 2.6vw;
    -webkit-transform: translateX(-50%); transform: translateX(-50%);
    white-space: nowrap;
    padding-bottom: 3.4vw;
  }
  /* Tarjeta estilo Apple TV: 5:3, radio ~10% de la altura, sin borde, logo completo */
  .app {
    display: inline-block; vertical-align: top; position: relative;
    width: 12.4vw; margin-right: 1.9vw;
  }
  .app:last-child { margin-right: 0; }
  .app .card {
    position: relative; width: 100%; height: 7.44vw;
    border-radius: 1.1vw; overflow: hidden;
    box-shadow: 0 .5vw 1.2vw rgba(0,0,0,.35);
    -webkit-transition: -webkit-transform .22s ease, box-shadow .22s ease;
    transition: transform .22s ease, box-shadow .22s ease;
  }
  /* Luz suave arriba, sombra abajo: da volumen a la tarjeta */
  .app .card:before {
    content: ""; position: absolute; left: 0; top: 0; right: 0; bottom: 0;
    background: linear-gradient(to bottom, rgba(255,255,255,.14) 0%, rgba(255,255,255,0) 45%, rgba(0,0,0,.12) 100%);
  }
  .app .logo {
    position: absolute; left: 50%; top: 50%;
    -webkit-transform: translate(-50%,-50%); transform: translate(-50%,-50%);
    max-height: 62%;
  }
  .app .logo.white { -webkit-filter: brightness(0) invert(1); filter: brightness(0) invert(1); }
  /* El nombre solo aparece en la tarjeta seleccionada */
  .app .name {
    position: absolute; left: 0; right: 0; top: 8.7vw; text-align: center;
    font-size: 1.15vw; font-weight: 500; opacity: 0;
    -webkit-transition: opacity .2s; transition: opacity .2s;
  }
  .app.focus .card {
    -webkit-transform: scale(1.14) translateY(-.3vw); transform: scale(1.14) translateY(-.3vw);
    box-shadow: 0 1.8vw 3.2vw rgba(0,0,0,.6);
  }
  .app.focus .name { opacity: 1; }
  .hint { position: absolute; right: 3vw; top: 6vw; font-size: 1vw; opacity: .7; text-shadow: 0 .1vw .4vw rgba(0,0,0,.7); }

  /* Menú de vidrio estilo Apple TV, arriba a la derecha (no tapa las tarjetas).
     La TV de 2017 no soporta backdrop-filter: se usa una copia desenfocada del fondo dentro del panel. */
  .menu {
    position: fixed; right: 1.8vw; top: 2vw; width: 16.5vw; height: 35.6vw; z-index: 4;
    border-radius: 2vw; overflow: hidden;
    box-shadow: 0 1.2vw 3.5vw rgba(0,0,0,.5);
    opacity: 0; -webkit-transform: translateX(125%); transform: translateX(125%);
    -webkit-transition: -webkit-transform .32s ease, opacity .25s; transition: transform .32s ease, opacity .25s;
  }
  .menu.open { opacity: 1; -webkit-transform: translateX(0); transform: translateX(0); }
  .menu-bg {
    position: absolute; right: -1.8vw; top: -2vw; width: 100vw; height: 100vh;
    background-size: cover; background-position: center;
    -webkit-filter: blur(26px) saturate(1.6) brightness(.72); filter: blur(26px) saturate(1.6) brightness(.72);
  }
  .menu-tint {
    position: absolute; left: 0; top: 0; right: 0; bottom: 0; border-radius: 2vw;
    background: linear-gradient(to bottom, rgba(120,120,128,.38) 0%, rgba(46,46,52,.5) 40%, rgba(18,18,22,.66) 100%);
    border: .1vw solid rgba(255,255,255,.16);
  }
  .menu-in { position: absolute; left: 0; top: 0; right: 0; bottom: 0; padding: 1.1vw .8vw; }
  .m-head { position: relative; height: 3.2vw; padding: 0 .5vw; margin-bottom: .6vw; white-space: nowrap; }
  .m-av {
    display: inline-block; vertical-align: middle; position: relative; overflow: hidden;
    width: 2.5vw; height: 2.5vw; border-radius: 50%;
    background: linear-gradient(135deg,#ffb3c9,#c9a6ff);
  }
  .m-av:before { content: ""; position: absolute; left: 50%; top: 22%; width: 34%; height: 34%; margin-left: -17%; border-radius: 50%; background: rgba(40,20,60,.85); }
  .m-av:after { content: ""; position: absolute; left: 50%; top: 58%; width: 66%; height: 60%; margin-left: -33%; border-radius: 50%; background: rgba(40,20,60,.85); }
  .m-nm { display: inline-block; vertical-align: middle; margin-left: .7vw; font-size: 1.15vw; font-weight: 600; }
  .m-tm { position: absolute; right: .5vw; top: 0; line-height: 2.5vw; font-size: .95vw; opacity: .75; }
  .m-sec { font-size: .85vw; opacity: .6; padding: .9vw .6vw .4vw; font-weight: 600; }
  .mi {
    height: 3.25vw; margin-bottom: .2vw; padding: 0 .55vw; border-radius: .9vw;
    white-space: nowrap; font-size: 1.1vw; font-weight: 500; line-height: 3.25vw;
    -webkit-transition: background .15s; transition: background .15s;
  }
  .mi.sel { background: rgba(255,255,255,.94); color: #101010; }
  .mi .ic {
    display: inline-block; vertical-align: middle; position: relative; overflow: hidden;
    width: 2.2vw; height: 2.2vw; border-radius: .55vw; margin-right: .8vw;
    background: rgba(255,255,255,.2);
  }
  .mi .ic svg { position: absolute; left: 50%; top: 50%; width: 1.2vw; height: 1.2vw; margin: -.6vw 0 0 -.6vw; fill: #fff; }
  .mi.sel .ic.plain { background: rgba(0,0,0,.1); }
  .mi.sel .ic.plain svg { fill: #101010; }
  .mi .ic img { position: absolute; left: 50%; top: 50%; -webkit-transform: translate(-50%,-50%); transform: translate(-50%,-50%); max-width: 66%; max-height: 58%; }
  .mi .ic img.white { -webkit-filter: brightness(0) invert(1); filter: brightness(0) invert(1); }
  .mi .lb { display: inline-block; vertical-align: middle; line-height: 1.2; }
  body.menu-on .pill, body.menu-on .hint { opacity: 0; }
  .pill, .hint { -webkit-transition: opacity .2s; transition: opacity .2s; }

  .hint .dot { display: inline-block; width: .8vw; height: .8vw; border-radius: 50%; vertical-align: middle; margin-right: .3vw; }

  .toast { white-space: pre-line;
    position: absolute; left: 50%; top: 11vw; width: 62vw; margin-left: -31vw; text-align: center;
    background: rgba(20,20,20,.92); border-radius: 1.2vw; padding: 1.4vw; font-size: 2vw; line-height: 1.4; z-index: 5;
    opacity: 0; -webkit-transition: opacity .3s; transition: opacity .3s;
  }

  .diag {
    display: none; position: fixed; left: 4vw; right: 4vw; top: 4vw; bottom: 4vw;
    background: rgba(0,0,0,.92); border-radius: 1.5vw; padding: 2vw;
    font-family: monospace; font-size: 1.1vw; line-height: 1.6; white-space: pre-wrap; overflow: hidden;
  }
  .diag img { width: 4vw; height: 4vw; vertical-align: middle; margin-right: 1vw; background: #333; }

  /* Selector de fondos */
  .picker {
    position: absolute; left: 0; right: 0; bottom: 0; padding: 2vw 4vw 3vw;
    background: rgba(10,10,14,.92);
    -webkit-transform: translateY(100%); transform: translateY(100%);
    -webkit-transition: -webkit-transform .3s ease; transition: transform .3s ease;
  }
  .picker.open { -webkit-transform: translateY(0); transform: translateY(0); }
  .picker h2 { font-size: 1.7vw; font-weight: 700; margin-bottom: 1.4vw; }
  .picker h2 span { font-size: 1.1vw; font-weight: 400; opacity: .7; margin-left: 1vw; }
  .thumbs { white-space: nowrap; }
  .thumb {
    display: inline-block; position: relative; width: 13vw; height: 7.3vw; margin-right: 1.2vw;
    border-radius: 1vw; background-size: cover; background-position: center; background-color: #333;
    -webkit-transition: -webkit-transform .15s ease; transition: transform .15s ease;
  }
  .thumb.focus { -webkit-transform: scale(1.1); transform: scale(1.1); }
  .thumb.focus:after { content: ""; position: absolute; left: -.3vw; top: -.3vw; right: -.3vw; bottom: -.3vw; border: .22vw solid #fff; border-radius: 1.25vw; }
  .thumb .lbl { position: absolute; left: .8vw; bottom: .6vw; font-size: 1vw; font-weight: 600; text-shadow: 0 .1vw .4vw #000; }
  .thumb.sel .lbl:before { content: "\2713  "; }
</style>
</head>
<body>
  <div id="bg"></div><div id="bg2"></div>
  <div class="shade-top"></div><div class="shade"></div>

  <div class="title" id="title">Buenas tardes<small id="date"></small></div>
  <div class="pill" id="clock">--:--</div>

  <div id="glow"></div>
  <div class="dock" id="dock"></div>
  <div class="hint"><i class="dot" style="background:#ffd60a"></i> Men&uacute; &nbsp;&nbsp; <i class="dot" style="background:#0a84ff"></i> Fondo</div>

  <div class="menu" id="menu">
    <div class="menu-bg" id="menuBg"></div>
    <div class="menu-tint"></div>
    <div class="menu-in">
      <div class="m-head"><span class="m-av"></span><span class="m-nm">Mi casa</span><span class="m-tm" id="mtime"></span></div>
      <div id="mlist"></div>
    </div>
  </div>
  <div class="toast" id="toast"></div>
  <div class="diag" id="diag"></div>

  <div class="picker" id="picker">
    <h2>Fondo de pantalla<span>&#9664; &#9654; elegir &middot; OK aplicar &middot; &#9660; cerrar</span></h2>
    <div class="thumbs" id="thumbs"></div>
  </div>

<script>
  // ===== Edita aquí tus apps =====
  var APPS = [
    // logo: archivo en /icons; size: ancho del logo (% de la tarjeta); white: pintar el logo de blanco; glow: color del resplandor
    { name: "YouTube", match: "youtube", url: "https://www.youtube.com/tv", web: true, bg: "#ffffff", logo: "youtube-wordmark", size: 66, glow: "255,0,0" },
    { name: "Netflix", match: "netflix", bg: "#ffffff", logo: "netflix-wordmark", size: 72, glow: "229,9,20" },
    { name: "DGO", match: "dgo", bg: "#ffffff", logo: "dgo", size: 58, glow: "245,130,31" },
    { name: "Prime Video", match: "prime", bg: "linear-gradient(180deg,#27b5ff,#0f8fe0)", logo: "primevideo", size: 84, white: true, tall: true, glow: "0,168,225" },
    { name: "Disney+", match: "disney", bg: "radial-gradient(ellipse at 50% 30%,#1f4fb8 0%,#0b1f5c 60%,#050f33 100%)", logo: "disneyplus", size: 70, white: true, glow: "40,90,220" },
    { name: "Spotify", match: "spotify", bg: "linear-gradient(180deg,#232323,#0d0d0d)", logo: "spotify", size: 36, glow: "30,215,96" }
  ];
  var ICONS = "https://cdn.jsdelivr.net/gh/asustechsync/tv-home@main/icons/";

  // ===== Edita aquí tus fondos (cualquier enlace a una imagen) =====
  var FONDOS = [
    { name: "Montañas", url: "https://picsum.photos/id/1018/1920/1080" },
    { name: "Lago",     url: "https://picsum.photos/id/1015/1920/1080" },
    { name: "Bosque",   url: "https://picsum.photos/id/1043/1920/1080" },
    { name: "Costa",    url: "https://picsum.photos/id/1053/1920/1080" },
    { name: "Ciudad",   url: "https://picsum.photos/id/1067/1920/1080" },
    { name: "Desierto", url: "https://picsum.photos/id/1002/1920/1080" },
    { name: "Noche",    url: "https://picsum.photos/id/1022/1920/1080" }
  ];

  function load(k, d) { try { var v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } }
  function save(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  function $(id) { return document.getElementById(id); }

  // Fondos: el principal en 4K (3840x2160); el del menú, que va desenfocado, en tamaño chico para ahorrar memoria
  function big(u)   { return u.replace("1920/1080", "3840/2160"); }
  function small(u) { return u.replace("1920/1080", "960/540"); }

  // --- Fondo ---
  var bgIdx = parseInt(load("tvhome.bg", "0"), 10) || 0;
  if (bgIdx >= FONDOS.length) bgIdx = 0;
  var front = $("bg"), back = $("bg2");
  function showBg(i) {
    var url = big(FONDOS[i].url);
    var img = new Image();
    img.onload = function () {
      back.style.backgroundImage = "url('" + url + "')";
      $("menuBg").style.backgroundImage = "url('" + small(FONDOS[i].url) + "')";
      back.style.opacity = 1; front.style.opacity = 0;
      var t = front; front = back; back = t;
    };
    img.src = url;
  }
  front.style.backgroundImage = "url('" + big(FONDOS[bgIdx].url) + "')";
  $("menuBg").style.backgroundImage = "url('" + small(FONDOS[bgIdx].url) + "')";

  // --- Dock ---
  var dock = $("dock"), apps = [], idx = 0;
  for (var i = 0; i < APPS.length; i++) {
    var el = document.createElement("div");
    el.className = "app";
    el.innerHTML = '<div class="card" style="background:' + APPS[i].bg + '">' +
      '<img class="logo' + (APPS[i].white ? ' white' : '') + '" src="' + ICONS + APPS[i].logo + '.svg" style="width:' + APPS[i].size + '%' + (APPS[i].tall ? ';max-height:none' : '') + '"></div>' +
      '<div class="name">' + APPS[i].name + '</div>';
    dock.appendChild(el); apps.push(el);
  }
  function focusApp(n) {
    idx = Math.max(0, Math.min(apps.length - 1, n));
    for (var i = 0; i < apps.length; i++) apps[i].className = i === idx ? "app focus" : "app";
    var c = APPS[idx].glow || "255,255,255";
    $("glow").style.background = "radial-gradient(ellipse at " + (8 + idx * 16.8) + "% 60%, rgba(" + c + ",.85) 0%, rgba(" + c + ",.25) 35%, rgba(" + c + ",0) 65%)";
  }
  focusApp(parseInt(load("tvhome.app", "0"), 10) || 0);

  // --- Selector ---
  var thumbs = [], tIdx = bgIdx, pickerOpen = false;
  for (var j = 0; j < FONDOS.length; j++) {
    var t = document.createElement("div");
    t.className = "thumb";
    t.style.backgroundImage = "url('" + FONDOS[j].url.replace("1920/1080", "400/225") + "')";
    t.innerHTML = '<div class="lbl">' + FONDOS[j].name + '</div>';
    $("thumbs").appendChild(t); thumbs.push(t);
  }
  function focusThumb(n) {
    tIdx = Math.max(0, Math.min(thumbs.length - 1, n));
    for (var i = 0; i < thumbs.length; i++) {
      thumbs[i].className = "thumb" + (i === tIdx ? " focus" : "") + (i === bgIdx ? " sel" : "");
    }
  }
  function openPicker(o) {
    pickerOpen = o;
    $("picker").className = o ? "picker open" : "picker";
    if (o) focusThumb(bgIdx);
  }

  // --- Menú lateral ---
  var SVG_HOME = '<svg viewBox="0 0 24 24"><path d="M12 3l9 8h-3v9h-5v-6h-2v6H6v-9H3z"/></svg>';
  var SVG_IMG  = '<svg viewBox="0 0 24 24"><path d="M4 5h16a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1zm2 11h12l-4-5-3 4-2-2z"/></svg>';
  var MENU = [
    { label: "Inicio", svg: SVG_HOME, act: "home" },
    { label: "Fondos", svg: SVG_IMG, act: "fondos" },
    { section: "Canales y Apps" }
  ];
  for (var q = 0; q < APPS.length; q++) MENU.push({ label: APPS[q].name, app: APPS[q] });

  var mlist = $("mlist"), mitems = [], menuOpen = false, mIdx = 0;
  for (var m = 0; m < MENU.length; m++) {
    var it = MENU[m], row = document.createElement("div");
    if (it.section) { row.className = "m-sec"; row.textContent = it.section; mlist.appendChild(row); continue; }
    row.className = "mi";
    if (it.svg) row.innerHTML = '<span class="ic plain">' + it.svg + '</span><span class="lb">' + it.label + '</span>';
    else row.innerHTML = '<span class="ic" style="background:' + it.app.bg + '"><img class="' + (it.app.white ? "white" : "") +
      '" src="' + ICONS + ({ netflix: "netflix", youtube: "youtube" }[it.app.match] || it.app.logo) + '.svg"></span><span class="lb">' + it.label + '</span>';
    mlist.appendChild(row); mitems.push({ el: row, data: it });
  }
  function focusMenu(n) {
    mIdx = Math.max(0, Math.min(mitems.length - 1, n));
    for (var i = 0; i < mitems.length; i++) mitems[i].el.className = i === mIdx ? "mi sel" : "mi";
  }
  function openMenu(o) {
    menuOpen = o;
    $("menu").className = o ? "menu open" : "menu"; document.body.className = o ? "menu-on" : "";
    if (o) focusMenu(0);
  }
  function menuAction() {
    var d = mitems[mIdx].data;
    openMenu(false);
    if (d.act === "fondos") openPicker(true);
    else if (d.app) openApp(d.app);
  }

  // Evita que las flechas desplacen la página (en la TV movían el fondo)
  window.addEventListener("scroll", function () { window.scrollTo(0, 0); });

  document.addEventListener("keydown", function (e) {
    var k = e.keyCode;
    if (k >= 37 && k <= 40) e.preventDefault();
    // Botones del control: amarillo (405) o 1 = menú, azul (406) o 2 = fondos
    if (k === 405 || k === 49) { openPicker(false); openMenu(!menuOpen); e.preventDefault(); return; }
    if (k === 406 || k === 50) { openMenu(false); openPicker(!pickerOpen); e.preventDefault(); return; }
    if (pickerOpen) {
      if (k === 37) focusThumb(tIdx - 1);
      else if (k === 39) focusThumb(tIdx + 1);
      else if (k === 13) { bgIdx = tIdx; save("tvhome.bg", bgIdx); showBg(bgIdx); focusThumb(tIdx); }
      else if (k === 40 || k === 10009 || k === 8) openPicker(false);
      e.preventDefault();
      return;
    }
    if (menuOpen) {
      if (k === 38) focusMenu(mIdx - 1);
      else if (k === 40) focusMenu(mIdx + 1);
      else if (k === 13) menuAction();
      else if (k === 39 || k === 37 || k === 10009 || k === 8) openMenu(false);
      e.preventDefault();
      return;
    }
    if (k === 37) focusApp(idx - 1);
    else if (k === 39) { if (idx === apps.length - 1) openMenu(true); else focusApp(idx + 1); }
    else if (k === 38) openPicker(true);
    else if (k === 40) toggleDiag();
    else if (k === 13) { save("tvhome.app", idx); openApp(APPS[idx]); }
  });

  // --- Abrir apps instaladas en la TV ---
  // Busca la app nativa por nombre; si no la encuentra, abre la web (sirve para YouTube TV).
  var installed = null;
  function loadInstalled(cb) {
    if (installed || typeof tizen === "undefined" || !tizen.application) { cb(); return; }
    try {
      tizen.application.getAppsInfo(function (list) { installed = list; cb(); }, function () { cb(); });
    } catch (e) { cb(); }
  }
  function findNative(app) {
    if (!installed || !app.match) return null;
    for (var i = 0; i < installed.length; i++) {
      if ((installed[i].name || "").toLowerCase().indexOf(app.match) >= 0) return installed[i].id;
    }
    return null;
  }
  function toast(msg) {
    var t = $("toast"); t.textContent = msg; t.style.opacity = 1;
    clearTimeout(toast.h); toast.h = setTimeout(function () { t.style.opacity = 0; }, 10000);
  }
  // IDs conocidos de cada app en TVs Samsung (varían según modelo/año; se prueban en orden)
  var APP_IDS = {
    netflix: ["11101200001", "3201907018807", "RN1MCdNq8t.Netflix", "org.tizen.netflix-app"],
    prime:   ["3201512006785", "3201910019365", "evKhCgZelL.AmazonIgnitionLauncher2", "org.tizen.primevideo"],
    disney:  ["3201901017640", "3202009021709", "3202204027038", "MCmYXNxgcu.DisneyPlus"],
    dgo:     ["3201907018786"],
    twitch:  ["3201908019041", "3202203026841", "owfmxp5uK6.Twitch"],
    spotify: ["3201606009684", "rJeHak5zRg.Spotify"],
    youtube: ["111299001912", "9Ur5IzDKqV.TizenYouTube"]
  };

  var errs = [];
  function why(n) {
    if (n === "SecurityError") return "SecurityError = TizenBrew no tiene permiso para abrir apps";
    if (n === "NotFoundError") return "NotFoundError = esa app no existe con ese ID";
    if (n === "InvalidValuesError") return "InvalidValuesError = ID no válido";
    return n;
  }
  function launchIds(ids, i, app, lastErr) {
    if (lastErr) errs.push(ids[i - 1] + ": " + lastErr);
    if (i >= ids.length) {
      toast("No se pudo abrir " + app.name + "\n" + (errs.length ? why(errs[errs.length - 1].split(": ")[1]) : "") +
            "\nIDs probados: " + errs.length);
      errs = [];
      return;
    }
    try {
      tizen.application.launch(ids[i], function () { errs = []; }, function (err) {
        launchIds(ids, i + 1, app, (err && err.name) || "error");
      });
    } catch (e) {
      launchIds(ids, i + 1, app, (e && e.name) || "error");
    }
  }

  // --- Prueba: ¿la TV deja leer los iconos de las apps instaladas? (▼ para abrir/cerrar) ---
  var diagOpen = false;
  function toggleDiag() {
    diagOpen = !diagOpen;
    var d = $("diag");
    d.style.display = diagOpen ? "block" : "none";
    if (!diagOpen) return;
    d.innerHTML = "PRUEBA DE ICONOS DE LA TV  (pulse ▼ para cerrar)\n\n";
    function line(html) { d.innerHTML += html + "\n"; }
    line("Resolución de la página: " + window.innerWidth + " x " + window.innerHeight +
         "   escala: " + window.devicePixelRatio + "   pantalla: " + screen.width + " x " + screen.height + "\n");
    if (typeof tizen === "undefined" || !tizen.application) { line("tizen: NO disponible en esta página"); return; }
    line("tizen: disponible ✓");
    try {
      tizen.application.getAppsInfo(function (l) { line("Listar apps: OK (" + l.length + " apps)"); },
                                    function (e) { line("Listar apps: ERROR " + e.name); });
    } catch (e) { line("Listar apps: ERROR " + e.name); }
    for (var a = 0; a < APPS.length; a++) {
      var app = APPS[a], ids = APP_IDS[app.match] || [], ok = false;
      for (var i = 0; i < ids.length && !ok; i++) {
        try {
          var info = tizen.application.getAppInfo(ids[i]);
          ok = true;
          line('<img src="' + info.iconPath + '" onload="this.style.background=\'#2a2\'" onerror="this.style.background=\'#a22\'">' +
               app.name + ": " + ids[i] + "  icono: " + (info.iconPath || "(vacío)"));
        } catch (e) { if (i === ids.length - 1) line(app.name + ": ERROR " + e.name); }
      }
    }
    line("\nCuadro VERDE = la TV deja mostrar el icono real.  ROJO = bloqueado.");
  }

  // Alternativa cuando la API de Tizen no está disponible: servicio interno de la TV (puerto 8001),
  // el mismo que usan las apps de control remoto. La TV se llama a sí misma por 127.0.0.1.
  function restLaunch(app) {
    var ids = (APP_IDS[app.match] || []).slice();
    var n = 0;
    (function next() {
      if (n >= ids.length) return;
      var id = ids[n++];
      var x = new XMLHttpRequest();
      x.open("POST", "http://127.0.0.1:8001/api/v2/applications/" + id, true);
      x.timeout = 4000;
      x.onload = function () { if (x.status === 404 || x.status === 400) next(); };
      x.onerror = x.ontimeout = function () { setTimeout(next, 500); };
      try { x.send(); } catch (e) { setTimeout(next, 500); }
    })();
  }

  function openApp(app) {
    if (app.web) { window.location.href = app.url; return; }
    if (typeof tizen === "undefined" || !tizen.application) {
      restLaunch(app);
      return;
    }
    var ids = (APP_IDS[app.match] || []).slice();
    var found = findNative(app);   // si la TV deja listar apps, se usa primero el ID real
    if (found) ids.unshift(found);
    launchIds(ids, 0, app, null);
  }
  loadInstalled(function () {});

  // --- Reloj y saludo ---
  function tick() {
    var d = new Date();
    $("clock").textContent = ("0" + d.getHours()).slice(-2) + ":" + ("0" + d.getMinutes()).slice(-2);
    $("mtime").textContent = $("clock").textContent;
    var dias = ["domingo","lunes","martes","miércoles","jueves","viernes","sábado"];
    var meses = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
    var g = d.getHours() < 12 ? "Buenos días" : d.getHours() < 19 ? "Buenas tardes" : "Buenas noches";
    $("title").firstChild.nodeValue = g;
    var dia = dias[d.getDay()];
    $("date").textContent = dia.charAt(0).toUpperCase() + dia.slice(1) + ", " + d.getDate() + " de " + meses[d.getMonth()];
  }
  tick(); setInterval(tick, 20000);
</script>
</body>
